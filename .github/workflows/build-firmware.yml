# Build a patched ArmVirtQemu firmware (code.fd) whose QemuRamfbDxe
# offers 2048x1536 as a GOP mode and boots into it.
#
# Usage:
#   1. Put qemu-ramfb-2048x1536.patch in this repository (default: repo root,
#      override with the patch_path input).
#   2. Run this workflow manually (workflow_dispatch).
#   3. Download the "WindowsiOS-code-fd-2048x1536" artifact -> code.fd.
#      vars.fd is NOT rebuilt; keep using the existing one.
#
# The firmware is stock tianocore EDK2 (ArmVirtQemu, AARCH64) at the pinned
# stable tag below, plus the ramfb patch. The built QEMU_EFI.fd is padded
# to 64 MiB, the pflash size the WindowsiOS engine expects for code.fd
# (same shape as Homebrew QEMU's edk2-aarch64-code.fd).

name: Build firmware (code.fd, ramfb 2048x1536)

on:
  workflow_dispatch:
    inputs:
      edk2_tag:
        description: "EDK2 stable tag to build"
        required: true
        default: "edk2-stable202608"
      patch_path:
        description: "Path of qemu-ramfb-2048x1536.patch in this repo"
        required: true
        default: "qemu-ramfb-2048x1536.patch"

jobs:
  build-firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repo (for the patch)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev acpica-tools python3 \
            gcc-aarch64-linux-gnu git

      - name: Clone EDK2 at pinned tag (with submodules)
        run: |
          git clone --depth 1 --branch "${{ inputs.edk2_tag }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/tianocore/edk2.git edk2

      - name: Apply ramfb 2048x1536 patch
        working-directory: edk2
        run: |
          git apply --check "$GITHUB_WORKSPACE/${{ inputs.patch_path }}"
          git apply "$GITHUB_WORKSPACE/${{ inputs.patch_path }}"
          grep -n "2048" OvmfPkg/QemuRamfbDxe/QemuRamfb.c
          git diff --stat

      - name: Build BaseTools
        working-directory: edk2
        run: make -C BaseTools -j"$(nproc)"

      - name: Build ArmVirtQemu firmware (AARCH64, RELEASE, GCC)
        working-directory: edk2
        run: |
          export GCC_AARCH64_PREFIX=aarch64-linux-gnu-
          source edksetup.sh
          build -a AARCH64 -t GCC -p ArmVirtPkg/ArmVirtQemu.dsc \
            -b RELEASE -n "$(nproc)"

      - name: Shape QEMU_EFI.fd into pflash code.fd (64 MiB)
        run: |
          FV=$(find edk2/Build -name QEMU_EFI.fd -print -quit)
          echo "Found firmware: $FV"
          test -n "$FV"
          cp "$FV" code.fd
          truncate -s 64M code.fd
          ls -la code.fd
          test "$(stat -c%s code.fd)" = "67108864"
          sha256sum code.fd

      - name: Upload code.fd
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-code-fd-2048x1536
          path: code.fd
          if-no-files-found: error
